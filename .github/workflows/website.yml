name: Website

on:
  push:
    branches: [main]
    paths:
      - src/**
      - scripts/**
      - tests/**
      - package.json
      - package-lock.json
      - astro.config.mjs
      - playwright.config.ts
      - .github/workflows/website.yml
  pull_request:
    paths:
      - src/**
      - scripts/**
      - tests/**
      - package.json
      - package-lock.json
      - astro.config.mjs
      - playwright.config.ts
      - .github/workflows/website.yml
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Sync GitHub releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run sync:releases
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Commit refreshed release index
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        working-directory: .
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/data/releases.json
          git diff --cached --quiet || git commit -m "website: refresh release downloads"
          git push

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
